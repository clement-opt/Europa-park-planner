<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Plan de route" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1F5C8B" />
    <meta name="description" content="Plan de route Europa-Park : itinéraire optimisé, Green Card et VirtualLine." />
    <link rel="icon" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Plan de route · Europa-Park</title>

    <!--
      Écran de lancement inline : il s'affiche avant le bundle et avant les polices,
      donc aucune webfont ici. Le wagon parcourt la voie d'un bord à l'autre : sa
      course EST la barre de chargement. main.tsx le retire une fois React monté.
    -->
    <style>
      #boot {
        position: fixed; inset: 0; z-index: 9999; overflow: hidden;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background:
          radial-gradient(90% 60% at 50% 18%, #2E7CB6 0%, #1B4F79 45%, #0E2438 100%);
        color: #F6F1E7; text-align: center;
        transition: opacity .5s ease, visibility .5s;
      }
      #boot.gone { opacity: 0; visibility: hidden; }

      /* Ciel : quelques étoiles qui respirent, sans jamais clignoter. */
      #boot .sky { position: absolute; inset: 0; }
      #boot .sky i {
        position: absolute; width: 3px; height: 3px; border-radius: 50%;
        background: #F6F1E7; opacity: .5; animation: twinkle 4s ease-in-out infinite;
      }

      #boot .head { position: relative; z-index: 2; padding: 0 24px; margin-bottom: 6vh; }
      #boot h1 {
        margin: 0; font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(30px, 9vw, 46px); font-weight: 700; letter-spacing: -.015em;
        text-shadow: 0 4px 18px rgba(0,0,0,.45);
      }
      #boot .sub {
        margin: 10px 0 0; font-family: system-ui, -apple-system, sans-serif;
        font-size: clamp(12px, 3.4vw, 15px); font-weight: 700;
        letter-spacing: .22em; text-transform: uppercase; color: #E3BA5A;
      }

      /* La voie occupe toute la largeur : le wagon va d'un bord à l'autre. */
      #boot .coaster { position: relative; z-index: 2; width: 100%; }
      #boot .coaster svg { display: block; width: 100%; height: auto; }

      #boot .say {
        position: relative; z-index: 2; margin-top: 4vh; min-height: 22px; padding: 0 24px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: clamp(14px, 3.8vw, 17px); color: #CFE0EE;
      }

      @keyframes twinkle { 0%, 100% { opacity: .22; } 50% { opacity: .85; } }

      @media (prefers-reduced-motion: reduce) {
        #boot .sky i { animation: none; }
        #boot .cart-motion { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite" aria-label="Chargement">
      <div class="sky" aria-hidden="true"></div>

      <div class="head">
        <h1>Plan de route</h1>
        <p class="sub">Europa-Park</p>
      </div>

      <div class="coaster">
        <svg viewBox="0 0 1000 420" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <defs>
            <!-- La voie, et en même temps la trajectoire du wagon. -->
            <path id="rail"
              d="M-60,330 C40,330 70,150 190,150 S330,320 430,300 S560,90 690,130 S850,300 1000,220 L1080,200" />
            <clipPath id="t1"><circle cx="-52" cy="-46" r="11"/></clipPath>
            <clipPath id="t2"><circle cx="-26" cy="-49" r="11"/></clipPath>
            <clipPath id="t3"><circle cx="0"   cy="-52" r="11"/></clipPath>
            <clipPath id="t4"><circle cx="26"  cy="-49" r="11"/></clipPath>
            <clipPath id="t5"><circle cx="52"  cy="-46" r="11"/></clipPath>
            <linearGradient id="fer" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#F6F1E7" stop-opacity=".95"/>
              <stop offset="1" stop-color="#F6F1E7" stop-opacity=".45"/>
            </linearGradient>
          </defs>

          <!-- Piliers -->
          <g stroke="#F6F1E7" stroke-opacity=".28" stroke-width="4" stroke-linecap="round">
            <path d="M120,238 V420 M260,178 V420 M400,300 V420 M560,150 V420 M700,130 V420 M860,268 V420"/>
            <path d="M120,300 L260,240 M400,340 L560,250 M700,230 L860,300" stroke-opacity=".18"/>
          </g>

          <!-- Voie : un trait plein, des traverses par-dessus -->
          <use href="#rail" fill="none" stroke="url(#fer)" stroke-width="7" stroke-linecap="round"/>
          <use href="#rail" fill="none" stroke="#0E2438" stroke-opacity=".35" stroke-width="2"
               stroke-dasharray="2 16" stroke-linecap="round"/>

          <!-- Le wagon, et nous dedans, bras en l'air -->
          <g class="cart-motion">
            <g transform="translate(0,-4)">
              <!-- Cinq passagers : chacun sa tête, chacun ses bras levés. -->
              <g id="equipage">
                <!-- casquette -->
                <g transform="translate(-52,0)">
                  <path d="M-9,-52 l-5,-13 M9,-52 l5,-13" stroke="#F2C98A" stroke-width="4.5" stroke-linecap="round"/>
                  <circle cx="0" cy="-46" r="11" fill="#F2C98A"/>
                  <path d="M-12,-50 a12,12 0 0 1 24,0 z" fill="#3B4A5A"/>
                  <path d="M-13,-50 h9" stroke="#3B4A5A" stroke-width="3.5" stroke-linecap="round"/>
                  <path d="M-5,-43 h10" stroke="#241C14" stroke-width="2.5" stroke-linecap="round"/>
                </g>
                <!-- cheveux courts -->
                <g transform="translate(-26,-3)">
                  <path d="M-9,-52 l-6,-12 M9,-52 l6,-12" stroke="#F2C98A" stroke-width="4.5" stroke-linecap="round"/>
                  <circle cx="0" cy="-46" r="11" fill="#F2C98A"/>
                  <path d="M-11,-49 a11,11 0 0 1 22,0 z" fill="#4A3826"/>
                  <path d="M-4,-42 q4,4 8,0" stroke="#241C14" stroke-width="2.2" fill="none" stroke-linecap="round"/>
                </g>
                <!-- pouces en l'air -->
                <g transform="translate(0,-6)">
                  <path d="M-9,-52 l-7,-13 M9,-52 l7,-13" stroke="#F2C98A" stroke-width="4.5" stroke-linecap="round"/>
                  <circle cx="-16" cy="-66" r="4" fill="#F2C98A"/><circle cx="16" cy="-66" r="4" fill="#F2C98A"/>
                  <circle cx="0" cy="-46" r="11" fill="#F2C98A"/>
                  <path d="M-11,-48 a11,11 0 0 1 22,0 q0,10 -6,12 l0,-9 -10,0 0,9 q-6,-2 -6,-12z" fill="#C9A227"/>
                  <ellipse cx="0" cy="-41" rx="5" ry="4" fill="#241C14"/>
                </g>
                <!-- lunettes noires -->
                <g transform="translate(26,-3)">
                  <path d="M-9,-52 l-6,-12 M9,-52 l6,-12" stroke="#F2C98A" stroke-width="4.5" stroke-linecap="round"/>
                  <circle cx="0" cy="-46" r="11" fill="#F2C98A"/>
                  <path d="M-11,-49 a11,11 0 0 1 22,0 z" fill="#2B2119"/>
                  <rect x="-9" y="-46" width="18" height="6" rx="3" fill="#241C14"/>
                </g>
                <!-- chemisier jaune -->
                <g transform="translate(52,0)">
                  <path d="M-9,-52 l-5,-13 M9,-52 l5,-13" stroke="#F2C98A" stroke-width="4.5" stroke-linecap="round"/>
                  <circle cx="0" cy="-46" r="11" fill="#F2C98A"/>
                  <path d="M-12,-48 a12,12 0 0 1 24,0 q1,9 -4,12 l-16,0 q-5,-3 -4,-12z" fill="#5A4030"/>
                  <rect x="-9" y="-47" width="18" height="6" rx="3" fill="#241C14"/>
                  <path d="M-13,-34 h26 l-3,10 h-20z" fill="#E3BA5A"/>
                </g>
              </g>

              <!-- Photo réelle : cinq hublots ronds, remplis dès que les têtes existent. -->
              <g id="photos" visibility="hidden">
                <image class="tete" data-i="1" x="-63" y="-57" width="22" height="22" clip-path="url(#t1)"/>
                <image class="tete" data-i="2" x="-37" y="-60" width="22" height="22" clip-path="url(#t2)"/>
                <image class="tete" data-i="3" x="-11" y="-63" width="22" height="22" clip-path="url(#t3)"/>
                <image class="tete" data-i="4" x="15"  y="-60" width="22" height="22" clip-path="url(#t4)"/>
                <image class="tete" data-i="5" x="41"  y="-57" width="22" height="22" clip-path="url(#t5)"/>
              </g>

              <!-- caisse par-dessus : les têtes dépassent, comme dans un vrai wagon -->
              <path d="M-64,-30 h128 a10,10 0 0 1 10,10 v18 a12,12 0 0 1 -12,12 h-124 a12,12 0 0 1 -12,-12 v-18 a10,10 0 0 1 10,-10z" fill="#C24634"/>
              <path d="M-64,-30 h128 a10,10 0 0 1 10,10 v18 a12,12 0 0 1 -12,12 h-124 a12,12 0 0 1 -12,-12 v-18 a10,10 0 0 1 10,-10z" fill="none" stroke="#F6F1E7" stroke-width="3"/>
              <path d="M-58,-24 h116" stroke="#E3BA5A" stroke-width="4" stroke-linecap="round"/>
              <!-- roues -->
              <circle cx="-40" cy="14" r="9" fill="#241C14" stroke="#F6F1E7" stroke-width="3"/>
              <circle cx="40"  cy="14" r="9" fill="#241C14" stroke="#F6F1E7" stroke-width="3"/>
            </g>
            <animateMotion dur="2.3s" fill="freeze" rotate="auto" keyPoints="0;1"
                           keyTimes="0;1" calcMode="spline" keySplines="0.45 0 0.35 1">
              <mpath href="#rail"/>
            </animateMotion>
          </g>

        </svg>
      </div>

      <div class="say">On graisse les rails…</div>
    </div>

    <div id="root"></div>
    <script>
      (function () {
        // La photo n'est posée que si elle existe : sinon le navigateur affiche
        // sa vignette d'image cassée en plein milieu du hublot.
        var sonde = new Image();
        sonde.onload = function () {
          var vrai = document.getElementById("photos");
          var dessin = document.getElementById("equipage");
          if (!vrai) return;
          [].forEach.call(vrai.querySelectorAll(".tete"), function (n) {
            n.setAttribute("href", "/tetes/" + n.dataset.i + ".png");
          });
          vrai.setAttribute("visibility", "visible");
          if (dessin) dessin.remove();
        };
        sonde.src = "/tetes/1.png";

        // Ciel semé de façon stable : pas de scintillement synchrone.
        var sky = document.querySelector("#boot .sky");
        if (sky) {
          var html = "";
          for (var i = 0; i < 34; i++) {
            html += '<i style="left:' + (Math.random() * 100).toFixed(2) + '%;top:' +
                    (Math.random() * 72).toFixed(2) + '%;animation-delay:' +
                    (Math.random() * 4).toFixed(2) + 's"></i>';
          }
          sky.innerHTML = html;
        }

        var lignes = [
          "On graisse les rails…",
          "On compte les jokers Green Card…",
          "On mesure les allées du parc…",
          "On interroge les files d'attente…",
          "On ménage les estomacs…",
          "On réserve les VirtualLine…"
        ];
        var el = document.querySelector("#boot .say");
        var i = Math.floor(Math.random() * lignes.length);
        if (el) {
          el.textContent = lignes[i];
          setInterval(function () { i = (i + 1) % lignes.length; el.textContent = lignes[i]; }, 1900);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
